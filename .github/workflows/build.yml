name: Build PostcardRTK

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

env:
  ESP32_CORE_VERSION: 3.0.7
  ARDUINOJSON_VERSION: 7.4.2
  BLESERIAL_VERSION: 3.0.0


# The Release step creates GitHub releases
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Host unit tests
        run: |
          S=firmware/PostcardRTK
          g++ -std=c++17 -Wall -Wextra -I$S test/test_main.cpp $S/nmea.cpp $S/rtcm.cpp $S/selector.cpp $S/methods.cpp \
            $S/sky.cpp $S/evtrim.cpp $S/ntrip_proto.cpp $S/ladder.cpp -o /tmp/t
          /tmp/t

      - name: Protocol test against the fake caster
        run: |
          g++ -std=c++17 -Ifirmware/PostcardRTK test/caster_e2e.cpp firmware/PostcardRTK/ntrip_proto.cpp firmware/PostcardRTK/rtcm.cpp -o /tmp/e2e
          python3 tools/fake_caster.py --port 21010 & sleep 1
          /tmp/e2e 21010 GOOD | tee /tmp/r1; grep -q "^Ok frames=[1-9]" /tmp/r1
          /tmp/e2e 21010 NOPE | grep -q "^Sourcetable"
          /tmp/e2e 21010 AUTH | grep -q "^Unauthorized"
          /tmp/e2e 21010 AUTH test:test | grep -q "^Ok frames=[1-9]"

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.3.1

      - name: Cache the ESP32 core
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: esp32-${{ env.ESP32_CORE_VERSION }}-json-${{ env.ARDUINOJSON_VERSION }}-ble-${{ env.BLESERIAL_VERSION }}

      - name: Install the ESP32 core and libraries
        run: |
          retry() { for i in 1 2 3 4; do "$@" && return 0; echo "attempt $i failed, retrying in $((i * 20)) s"; sleep $((i * 20)); done; return 1; }
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          retry arduino-cli core update-index
          retry arduino-cli core install esp32:esp32@${ESP32_CORE_VERSION}
          retry arduino-cli lib install ArduinoJson@${ARDUINOJSON_VERSION}
          retry arduino-cli lib install ESP32_BleSerial@${BLESERIAL_VERSION}

      - name: Build
        run: |
          VERSION=$(git describe --tags --always)
          POSTCARDRTK_VERSION=$VERSION bash tools/build.sh
          mkdir -p out
          cp build/PostcardRTK.ino.bin out/PostcardRTK-$VERSION.bin
          cp build/PostcardRTK.ino.merged.bin out/PostcardRTK-$VERSION-merged_0x0.bin
          (cd out && sha256sum * > SHA256SUMS.txt)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: PostcardRTK-${{ env.VERSION }}
          path: out/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # Versions below 1.0 and versions with a suffix (v1.2.0-rc1) are published as pre-releases
          prerelease: ${{ startsWith(github.ref_name, 'v0.') || contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: out/*
